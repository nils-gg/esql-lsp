[package]
authors = [ "" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "Esql grammar for tree-sitter"
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "esql" ]
license = "MIT"
name = "tree-sitter-esql"
readme = "README.md"
repository = "https://github.com/tree-sitter/tree-sitter-esql"
version = "1.0.0"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.1"
